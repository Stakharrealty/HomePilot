<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing — HomePilot</title>
<!--
  listing.html — one listing, in HomePilot's fixed order:
    1. Top row: HomePilot view (what this home costs THIS buyer, and its
       fit tier) + photo gallery. On narrow screens these stack, cost view
       first. On wide screens they sit side by side -- gallery on the
       left, cost view on the right (CSS `order`; DOM/reading order is
       unchanged -- see listing-detail.js).
    2. Property details (every stored field)
    3. Description
    (Compare follows in a later release)
  then the brokerage line and PROPTX notices.

  Query params: ?key=<listingKey>[&budget=<price the buyer was shown>]
  The buyer's own numbers arrive via sessionStorage (see buyer-profile.js),
  never the URL. All math runs locally in the browser; no listing data is
  sent to any AI or third-party service.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.lw{max-width:1800px;margin:0 auto;padding:1.25rem 1rem 3rem}
@media(min-width:1024px){.lw{padding-left:2rem;padding-right:2rem}}

.lp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid #e8e8e8;gap:16px}
.lp-logo{font-size:17px;font-weight:600;color:#1a1a1a;display:flex;align-items:center;gap:8px;text-decoration:none}
.lp-logo-icon{width:26px;height:26px;background:#1D9E75;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.lp-back{font-size:13px;font-weight:600;color:#1D9E75;text-decoration:none;padding:8px 14px;border-radius:8px;border:1.5px solid #1D9E75;white-space:nowrap}
.lp-back:hover{background:#E1F5EE}

.listings-loading,.listings-error{padding:2rem;text-align:center;color:#555;font-size:14px;background:#fff;border-radius:12px;border:1px solid #e8e8e8}
.listings-error{color:#c0392b;background:#FAEEDA;border-color:#F0D9A8}

.ld-head{margin-bottom:14px}
.ld-head h1{font-size:22px;font-weight:800;line-height:1.3}
.ld-sub{font-size:13px;color:#555;margin-top:2px}

.ld-sec{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:14px}
/* Top row: HomePilot cost view + photo gallery. On narrow screens these
   just stack in DOM order (cost view first, unchanged from before -- see
   listing-detail.js). On wide screens they sit side by side, with `order`
   swapping the gallery to the left and the cost view to the right --
   visual position only, reading/tab order is untouched. */
@media(min-width:760px){
  .ld-top{display:flex;gap:16px;align-items:flex-start}
  .ld-top>.ld-sec{flex:1 1 0;min-width:0}
  .ld-top>.ld-hp{order:2}
  .ld-top>.ld-gallery{order:1}
}
.ld-sec h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#1D9E75;margin-bottom:10px}
.ld-sec h3{font-size:14px;font-weight:700;margin:14px 0 6px}
.ld-price{font-size:28px;font-weight:800}
.ld-muted{font-size:14px;color:#555;line-height:1.5;margin-top:8px}
.ld-muted a{color:#1D9E75;font-weight:600}
.ld-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:15px}
.ld-row:last-child{border-bottom:0}
.ld-total,.ld-remaining{font-weight:800}
.ld-total{border-top:2px solid #e8e8e8;margin-top:2px}
.ld-income{margin-top:12px;padding-top:6px;border-top:1px dashed #ddd}
.ld-remaining span:last-child{color:#1D6B3F}
.ld-assumptions{font-size:12px;color:#666;margin-top:8px}
.ld-comfort{font-size:13px;color:#333;font-weight:600;margin-top:10px;padding-top:10px;border-top:1px dashed #ddd}
.ld-credit span:last-child{color:#1D6B3F}
.ld-onetime{margin-top:18px;padding-top:14px;border-top:2px solid #e8e8e8}
.ld-disclosure{font-size:11px;color:#888}
.ld-facts{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 16px}
.ld-facts li{font-size:15px;padding:6px 0;border-bottom:1px solid #f0f0f0}

/* Photo gallery: same markup and carousel code as the listing card
   (attachPhotoCarousel in listings-display.js); arrows always visible here. */
.ld-gallery{padding:0;overflow:hidden}
.listing-photo-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#f0f0f0}
.listing-photo{width:100%;height:100%;object-fit:cover;display:block}
.listing-photo-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;background:#f0f0f0}
.listing-photo-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.listing-photo-prev{left:10px}.listing-photo-next{right:10px}
.listing-photo-nav:hover{background:rgba(0,0,0,.8)}
.listing-photo-counter{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;pointer-events:none}
.ld-remarks{font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ld-tour{display:inline-block;margin-top:12px;font-size:14px;font-weight:700;color:#1D9E75}

.listing-affordability-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:middle;margin-left:6px}
.listing-fit-fg{background:#E1F5EE;color:#085041}
.listing-fit-fo{background:#E6F1FB;color:#0C447C}
.listing-fit-fs{background:#FAEEDA;color:#633806}

.ld-compliance{margin-top:18px}
.listing-brokerage{font-size:15px;color:#333;margin-top:2px}
.listings-idx-notice{font-size:12px;color:#555;line-height:1.55;margin-top:12px;padding:12px 14px;background:#fff;border:1px solid #e8e8e8;border-radius:10px}
.listings-idx-notice p+p{margin-top:6px}
/* 55+ / adult-lifestyle label (2026-09-23): a fact about who may buy, not a warning colour. */
.listing-age-note{font-size:12px;color:#5B4A1F;background:#F6F1E4;border-radius:6px;padding:4px 8px;margin-top:6px;display:inline-block}
</style>
</head>
<body>
<div class="lw">
  <div class="lp-hdr">
    <a class="lp-logo" href="https://myhomepilot.ca">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <rect width="32" height="32" rx="8" fill="#1D9E75"/>
        <polygon points="16,5 5,13 5,27 12,27 12,20 20,20 20,27 27,27 27,13" fill="white"/>
        <circle cx="16" cy="19" r="3" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
        <line x1="16" y1="16" x2="16" y2="12" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round"/>
        <polygon points="16,10 14,14 18,14" fill="#1D9E75"/>
      </svg>
      <span>HomePilot</span>
    </a>
    <a class="lp-back" href="listings.html" id="ldBack" onclick="if (document.referrer.indexOf(location.origin) === 0 &amp;&amp; history.length > 1) { history.back(); return false; }">← Back to listings</a>
  </div>

  <div id="ldRoot"></div>
</div>

<script src="src/config.js"></script>
<script src="src/listing-page-globals.js"></script>
<script src="src/cities.js"></script>
<script src="src/mortgage.js"></script>
<script src="src/closingcosts.js"></script>
<script src="src/utils.js"></script>
<script src="src/i18n.js"></script>
<script src="src/explainability.js"></script>
<script src="src/ai.js"></script>
<script src="src/buyer-profile.js"></script>
<script src="src/listings-display.js"></script>
<script src="src/listing-fit.js"></script>
<script src="src/listing-detail.js"></script>
</body>
</html>
