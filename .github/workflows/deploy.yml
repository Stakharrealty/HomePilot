name: Test and Deploy HomePilot

# Phase 4 — this is the automated deploy pipeline.
# Trigger: any push to main (main only mirrors what should be live).
# Runs all 4 Phase 3 test suites in order. If any suite fails, the job
# stops immediately and the "deploy" step never runs — nothing reaches
# Cloudflare unless every check is green.

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Start local static server (for module-load and smoke tests)
        run: |
          npx http-server -p 8843 -s > /tmp/httpserver.log 2>&1 &
          npx wait-on http://localhost:8843/index.html --timeout 15000

      - name: Module load verification
        run: npm run test:browser-load

      - name: Functional smoke test
        run: npm run test:smoke

      - name: Regression suite
        run: npm run test

      # Dense monotonicity + minimum-down-payment invariants for the
      # affordability engine. The regression suite samples down payments at
      # {25k,50k,100k,150k,200k} and steps straight over the discontinuity at
      # 33k-34k, so it reported those properties as holding while they were
      # false. This one samples densely.
      - name: Affordability engine invariants
        run: npm run test:engine-invariants

      # The insights Worker was an open, unauthenticated Anthropic proxy whose
      # content guardrails lived client-side, where any caller could drop them.
      # This asserts they are enforced server-side and the abuse paths stay shut.
      - name: Insights worker hardening
        run: npm run test:insights-hardening

      - name: Listings CI suite
        run: npm run test:listings-ci

      - name: KV integrity test
        run: npm run test:kv

      - name: How this works info modal test
        run: npm run test:how-this-works

      - name: Calculator independent scroll test
        run: npm run test:calc-scroll

      - name: Results single-column layout test
        run: npm run test:results-single-col

      - name: Listing verified seal removed test
        run: npm run test:listing-seal-removed

      - name: Footer contact section test
        run: npm run test:footer-contact

      # What a buyer actually sees (IMPROVEMENT_PLAN.md 1.6): the real calculator
      # page in jsdom -- commute limit, #1 card has no warning, the cards the PDF
      # report and Compare use (shownCards) equal the cards on screen. Needs the
      # static server started above.
      - name: Results outcome tests
        run: npm run test:results-outcomes

      # The homepage says nothing the product does not back up, and its
      # example is the engine's real output (IMPROVEMENT_PLAN.md 1.3).
      - name: Homepage claims test
        run: npm run test:homepage-claims

      # The site is English only (IMPROVEMENT_PLAN.md 2.4b): no language menu
      # or translated text on any page, and a visitor arriving with a language
      # preference still gets the full English page.
      - name: English only test
        run: npm run test:english-only

      # Phone fixes (IMPROVEMENT_PLAN.md 2.10): the homepage example shows on
      # phones, and the WhatsApp button covers nothing a buyer needs: the footer
      # scrolls clear of it, its note steps aside on phones, it moves above the
      # compare bar, and pop-ups sit above it. Needs the static server above.
      - name: Phone fixes test
        run: npm run test:phone-fixes

      # Everything above must exit 0 or the workflow stops here —
      # GitHub Actions fails the whole run on the first non-zero exit,
      # so this step is unreachable unless all 4 suites passed.
      #
      # Build a clean deploy folder with ONLY what buyers should ever see:
      # index.html + listings.html + the 3 static legal pages + src/. This
      # deliberately excludes tests/, workers/ (which includes SECRETS.md,
      # RECOVERY.md, worker source), README.md, and package*.json — none of
      # that should ever be publicly servable from myhomepilot.ca.
      - name: Build deploy folder
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp listings.html deploy/
          cp listing.html deploy/
          cp privacy-policy.html deploy/
          cp terms-of-use.html deploy/
          cp disclaimer.html deploy/
          cp calculator.html deploy/
          cp -r src deploy/
          # Build stamp (added 2026-09-22, audit): nothing in the deployed site
          # said what version it was. There was no commit SHA, no build time, no
          # version string anywhere in the HTML or JS, so the only way to know
          # what production was running was to guess from the deploy history.
          # Served as a static file, so it needs no page changes and cannot 404
          # a script tag: curl https://myhomepilot.ca/build-info.json
          cat > deploy/build-info.json << BUILDINFO
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runId": "${GITHUB_RUN_ID}"
          }
          BUILDINFO
          echo "Deploying ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          # Google Maps browser key — injected from repo secrets at build time so
          # the key is never stored in the repository. The key is referrer-locked
          # to myhomepilot.ca in Google Cloud. If the secret is unset, the map
          # block hides itself and nothing else changes.
          printf "window.HOMEPILOT_MAPS_KEY='%s';\n" "$GOOGLE_MAPS_API_KEY" > deploy/src/maps-key.js
          cat > deploy/wrangler.jsonc << 'EOF'
          {
            "name": "little-heart-362f",
            "compatibility_date": "2026-07-16",
            "assets": {
              "directory": "./"
            }
          }
          EOF

      - name: Deploy to Cloudflare Workers (little-heart-362f)
        run: npx wrangler deploy
        working-directory: ./deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
