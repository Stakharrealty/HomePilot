name: Test homepilot-listings

# Trigger matches deploy.yml's branch (main only), consistent with the
# original 2026-07-21 decision to keep listings tests off dev pushes --
# only once merged to main. Still separate from deploy.yml itself because:
# - Tests a different Worker (homepilot-listings), not the main app
# - Does NOT deploy anything. This is test-only until homepilot-listings
#   has its own real deploy pipeline (deploy-listings.yml handles that
#   separately, with its own pre-deploy test gate).
#
# DDF REMOVED 2026-09-18: every test this workflow used to run was CREA/DDF
# ingest-specific and has been deleted along with the DDF pipeline itself
# (see workers/homepilot-listings and decisions-and-learnings.md). This
# workflow now runs the tests that survived removal. Rebuild PropTx-
# specific test coverage and re-add matching path triggers once that
# integration is wired in.

on:
  push:
    branches: [main]
    paths:
      - "workers/homepilot-listings/**"
      - "tests/listing_verified_seal_removed_test.js"
      - "tests/listings_popup_redesign_test.js"
      - "tests/listings_property_classification_test.js"
      - "tests/listings_affordability_budget_test.js"

jobs:
  test-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Listing seal/badge removal test (no network required)
        run: node tests/listing_verified_seal_removed_test.js

      - name: Popup redesign test (no network required)
        run: node tests/listings_popup_redesign_test.js

      - name: Property-type classification test (no network required, real SQLite)
        run: node --no-warnings tests/listings_property_classification_test.js

      - name: Affordability budget test (no network required)
        run: node --no-warnings tests/listings_affordability_budget_test.js
