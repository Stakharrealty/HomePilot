name: Dev to Main (auto-merge on green tests)

# Trigger: any push to dev.
# Runs the same test suites as deploy.yml. If every suite passes, fast-forward
# merges dev into main and pushes -- which then triggers deploy.yml and goes
# live on Cloudflare. If any suite fails, the merge step never runs and main
# is left untouched.
#
# Uses --ff-only: main only ever advances to match dev exactly, never a merge
# commit. If main has diverged (was edited directly, which it shouldn't be
# per README), the fast-forward fails safely instead of auto-resolving.

on:
  push:
    branches: [dev]

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Start local static server (for module-load and smoke tests)
        run: |
          npx http-server -p 8843 -s > /tmp/httpserver.log 2>&1 &
          npx wait-on http://localhost:8843/index.html --timeout 15000

      - name: Module load verification
        run: npm run test:browser-load

      - name: Functional smoke test
        run: npm run test:smoke

      - name: Regression suite
        run: npm run test

      # See deploy.yml for why these two exist.
      - name: Affordability engine invariants
        run: npm run test:engine-invariants

      - name: Insights worker hardening
        run: npm run test:insights-hardening

      - name: Listings CI suite
        run: npm run test:listings-ci

      - name: KV integrity test
        run: npm run test:kv

      - name: How this works info modal test
        run: npm run test:how-this-works

      - name: Calculator independent scroll test
        run: npm run test:calc-scroll

      - name: Results single-column layout test
        run: npm run test:results-single-col

      - name: Listing verified seal removed test
        run: npm run test:listing-seal-removed

      - name: Footer contact section test
        run: npm run test:footer-contact

      # What a buyer actually sees (IMPROVEMENT_PLAN.md 1.6): the real calculator
      # page in jsdom -- commute limit, #1 card has no warning, the cards the PDF
      # report and Compare use (shownCards) equal the cards on screen. Needs the
      # static server started above.
      - name: Results outcome tests
        run: npm run test:results-outcomes

      # The consent pop-up before any result (src/consent.js): the button goes
      # through it, the agreement is version-stamped so changed legal copy asks
      # again, and it stays closed while "Work arrangement" or "First-time
      # buyer" is unanswered (IMPROVEMENT_PLAN.md 2.5). Reads the files; no server.
      - name: Consent gate test
        run: npm run test:consent-gate

      # The homepage says nothing the product does not back up, and its
      # example is the engine's real output (IMPROVEMENT_PLAN.md 1.3).
      - name: Homepage claims test
        run: npm run test:homepage-claims

      # The site is English only (IMPROVEMENT_PLAN.md 2.4b): no language menu
      # or translated text on any page, and a visitor arriving with a language
      # preference still gets the full English page.
      - name: English only test
        run: npm run test:english-only

      # Phone fixes (IMPROVEMENT_PLAN.md 2.10): the homepage example shows on
      # phones, and the WhatsApp button covers nothing a buyer needs: the footer
      # scrolls clear of it, its note steps aside on phones, it moves above the
      # compare bar, and pop-ups sit above it. Needs the static server above.
      - name: Phone fixes test
        run: npm run test:phone-fixes

      # Everything above must exit 0 or the workflow stops here -- this
      # step (and therefore the push to main) is unreachable otherwise.
      - name: Fast-forward main to dev and push
        env:
          GH_TOKEN: ${{ secrets.DEV_TO_MAIN_TOKEN }}
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Stakharrealty/HomePilot.git
          git fetch origin main
          git checkout main
          git merge --ff-only origin/dev
          git push origin main
