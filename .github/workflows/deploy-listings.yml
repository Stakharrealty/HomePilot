name: Deploy homepilot-listings

# Deploys the homepilot-listings Worker via wrangler, using the same
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets already configured
# for the main app's deploy.yml pipeline (same Cloudflare account).
#
# IMPORTANT: DDF_CLIENT_ID and DDF_CLIENT_SECRET secrets are stale leftovers
# from the removed DDF integration (2026-09-18) -- no code references them
# anymore. Safe to delete from the Cloudflare dashboard whenever convenient;
# not required for this workflow to keep working. The D1 binding IS
# declared in wrangler.jsonc, which is required -- any binding not
# declared there gets stripped on deploy.
#
# Runs the listings tests that survived DDF removal (frontend display,
# popup redesign, property classification, affordability budget, seal
# removal) as a safety gate. Does NOT run a metadata-fields test here since
# there is no ingest pipeline live yet (PropTx not wired in).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "workers/homepilot-listings/**"

jobs:
  deploy-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Pre-deploy tests (no network required)
        run: |
          node tests/listing_verified_seal_removed_test.js
          node tests/listings_popup_redesign_test.js
          node --no-warnings tests/listings_property_classification_test.js
          node --no-warnings tests/listings_affordability_budget_test.js

      - name: Deploy to Cloudflare Workers (homepilot-listings)
        run: npx wrangler deploy
        working-directory: ./workers/homepilot-listings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
