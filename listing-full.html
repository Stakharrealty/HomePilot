<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing details — HomePilot</title>
<!--
  listing-full.html — the full listing: every stored field, all photos, the
  complete description. Opened in a new tab from the "View Details" link on
  the listing card.

  Query params: ?key=<listingKey>
  Nothing about the buyer is needed here (no profile, no budget); the only
  network call is GET /listing?key= on this app's own listings API.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.lw{max-width:860px;margin:0 auto;padding:1.25rem 1rem 3rem}

.lp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid #e8e8e8;gap:16px}
.lp-logo{font-size:17px;font-weight:600;color:#1a1a1a;display:flex;align-items:center;gap:8px;text-decoration:none}
.lp-logo-icon{width:26px;height:26px;background:#1D9E75;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.lp-back{font-size:13px;font-weight:600;color:#1D9E75;text-decoration:none;padding:8px 14px;border-radius:8px;border:1.5px solid #1D9E75;white-space:nowrap}
.lp-back:hover{background:#E1F5EE}

.listings-loading,.listings-error{padding:2rem;text-align:center;color:#555;font-size:14px;background:#fff;border-radius:12px;border:1px solid #e8e8e8}
.listings-error{color:#c0392b;background:#FAEEDA;border-color:#F0D9A8}

.ld-head{margin-bottom:14px}
.ld-head h1{font-size:22px;font-weight:800;line-height:1.3}
.ld-sub{font-size:13px;color:#555;margin-top:2px}

.ld-sec{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.ld-sec h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#1D9E75;margin-bottom:10px}
.ld-price{font-size:28px;font-weight:800;margin-top:6px}
.ld-muted{font-size:14px;color:#555;line-height:1.5;margin-top:8px}
.ld-facts{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 16px}
.ld-facts li{font-size:15px;padding:6px 0;border-bottom:1px solid #f0f0f0}
.lf-remarks{font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.lf-tour{display:inline-block;margin-top:12px;font-size:14px;font-weight:700;color:#1D9E75}

/* Photo gallery: same markup and carousel code as the listing card
   (attachPhotoCarousel in listings-display.js); arrows always visible here. */
.lf-gallery{padding:0;overflow:hidden}
.listing-photo-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#f0f0f0}
.listing-photo{width:100%;height:100%;object-fit:cover;display:block}
.listing-photo-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;background:#f0f0f0}
.listing-photo-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.listing-photo-prev{left:10px}.listing-photo-next{right:10px}
.listing-photo-nav:hover{background:rgba(0,0,0,.8)}
.listing-photo-counter{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;pointer-events:none}

.ld-compliance{margin-top:18px}
.listing-brokerage{font-size:15px;color:#333;margin-top:2px}
.listings-idx-notice{font-size:12px;color:#555;line-height:1.55;margin-top:12px;padding:12px 14px;background:#fff;border:1px solid #e8e8e8;border-radius:10px}
.listings-idx-notice p+p{margin-top:6px}
</style>
</head>
<body>
<div class="lw">
  <div class="lp-hdr">
    <a class="lp-logo" href="https://myhomepilot.ca">
      <span class="lp-logo-icon">🏠</span>
      <span>HomePilot</span>
    </a>
    <a class="lp-back" href="listings.html" id="ldBack">← Back to listings</a>
  </div>

  <div id="lfRoot"></div>
</div>

<script src="src/config.js"></script>
<script src="src/listing-page-globals.js"></script>
<script src="src/cities.js"></script>
<script src="src/mortgage.js"></script>
<script src="src/utils.js"></script>
<script src="src/i18n.js"></script>
<script src="src/explainability.js"></script>
<script src="src/ai.js"></script>
<script src="src/buyer-profile.js"></script>
<script src="src/listings-display.js"></script>
<script src="src/listing-fit.js"></script>
<script src="src/listing-full.js"></script>
</body>
</html>
